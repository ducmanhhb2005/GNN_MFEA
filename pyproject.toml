[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "gnn-mfea-idpc-du"
version = "0.1.0"
description = "Modular research prototype: MFEA-EDU with GNN-guided initialization"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["idpc_du", "mfea", "gnn", "integration", "app", "experiments", "experiments._support"]
